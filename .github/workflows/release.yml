name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build arm64
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Package application
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/package-release.sh "${VERSION#v}" arm64

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: AtollCodexUsage-arm64
          path: |
            build/release/*.zip
            build/release/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/*
          --repo "${{ github.repository }}"
          --title "Atoll Codex Usage ${{ github.ref_name }}"
          --generate-notes
          --verify-tag
