name: Remove Intel release assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/remove-intel-release-assets.yml"

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Remove Intel assets from v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset v0.1.0 AtollCodexUsage-v0.1.0-macOS-x86_64.zip --yes --repo "${{ github.repository }}"
          gh release delete-asset v0.1.0 AtollCodexUsage-v0.1.0-macOS-x86_64.zip.sha256 --yes --repo "${{ github.repository }}"
